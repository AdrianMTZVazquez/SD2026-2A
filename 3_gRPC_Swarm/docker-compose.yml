x-client-base: &client-base
  image: grpc-img
  command: ["python3", "client.py"]
  depends_on: [servidor]
  networks: [grpc-net]

# Dos contenedores de la misma imagen conectados por gRPC
services:
  servidor:
    build: .
    image: grpc-img
    container_name: servidor
    hostname: servidor
    command: ["python3", "server.py"]
    networks: [grpc-net]

  cliente-1:
    <<: *client-base
    build: .
    environment:
      - SERVIDOR=servidor:50051
      - CLIENTE_ID=Adrian
  cliente-2:
    <<: *client-base
    build: .
    environment:
      - SERVIDOR=servidor:50051
      - CLIENTE_ID=Juan

networks:
  grpc-net:
